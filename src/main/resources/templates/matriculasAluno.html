<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minhas Matrículas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Sistema de Matrícula
        </span>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="fw-bold">
        Minhas Matrículas
    </h2>

    <p class="text-muted">
        Disciplinas em que você está matriculado.
    </p>


    <!-- Quando não houver matrícula -->

    <div
        th:if="${#lists.isEmpty(matriculas)}"
        class="alert alert-info">

        Você ainda não está matriculado em nenhuma disciplina.

    </div>


    <!-- Matrículas -->

    <div
        th:each="matricula : ${matriculas}"
        class="card shadow-sm mb-3">

        <div class="card-body">

            <h5
                class="card-title"
                th:text="${matricula[1]}">

                Nome da disciplina

            </h5>


            <p class="card-text">

                <strong>Professor:</strong>

                <span th:text="${matricula[2]}">
                    Professor
                </span>

                <br>


                <strong>Ano:</strong>

                <span th:text="${matricula[3]}">
                    2026
                </span>

                <br>


                <strong>Semestre:</strong>

                <span th:text="${matricula[4]}">
                    2
                </span>

            </p>

        </div>

    </div>


    <a
        th:href="@{/aluno/AreaAluno}"
        class="btn btn-secondary">

        Voltar

    </a>

</div>

</body>

</html>
