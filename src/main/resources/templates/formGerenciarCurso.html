<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gerenciar Curso - Sistema de Matrícula</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 15px;
        }

    </style>

</head>

<body>


<nav class="navbar navbar-dark bg-dark mb-5">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">

            <i class="bi bi-mortarboard-fill me-2"></i>

            Sistema de Matrícula

        </a>

    </div>

</nav>


<div class="container">

    <div class="mb-4">

        <h2 class="fw-bold">
            Gerenciar Curso
        </h2>

        <p class="text-muted">
            Altere os dados do curso cadastrado.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">


            <!-- FORMULÁRIO DE ATUALIZAÇÃO -->

            <form th:action="@{/curso/atualizar}"
                  method="post">


                <!-- ID DO CURSO -->

                <input type="hidden"
                       name="idCurso"
                       th:value="${curso.idCurso}">


                <div class="row g-3">


                    <!-- NOME -->

                    <div class="col-md-8">

                        <label class="form-label">
                            Nome do Curso
                        </label>

                        <input type="text"
                               name="nome"
                               class="form-control"
                               th:value="${curso.nome}"
                               required>

                    </div>


                    <!-- ANO -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Ano de início
                        </label>

                        <input type="number"
                               name="ano_inicio"
                               class="form-control"
                               th:value="${curso.ano_inicio}"
                               required>

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-between">


                    <!-- VOLTAR -->

                    <a th:href="@{/curso/listar}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left me-1"></i>

                        Voltar

                    </a>


                    <div>


                        <!-- EXCLUIR -->

                        <button type="button"
                                class="btn btn-danger me-2"
                                onclick="excluirCurso()">

                            <i class="bi bi-trash me-1"></i>

                            Excluir

                        </button>


                        <!-- SALVAR -->

                        <button type="submit"
                                class="btn btn-success">

                            <i class="bi bi-check-lg me-1"></i>

                            Salvar alterações

                        </button>

                    </div>

                </div>

            </form>


            <!-- FORMULÁRIO DE EXCLUSÃO -->

            <form id="formExcluir"
                  th:action="@{/curso/excluir}"
                  method="post">

                <input type="hidden"
                       name="idCurso"
                       th:value="${curso.idCurso}">

            </form>


        </div>

    </div>

</div>


<script>

function excluirCurso() {

    if (confirm(
        'Tem certeza que deseja excluir o curso "' +
        '[[${curso.nome}]]' +
        '"? Essa ação não pode ser desfeita.'
    )) {

        document.getElementById('formExcluir').submit();

    }

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
