<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Curso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card-header {
            background-color: #2c3e50;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Cadastrar Curso</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/curso/salvar}"
                  th:object="${curso}"
                  method="post">

                <!-- Nome -->
                <div class="mb-3">

                    <label class="form-label">
                        Nome do Curso
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nome}"
                           placeholder="Digite o nome do curso"
                           required>

                </div>

                <!-- Ano de início -->
                <div class="mb-3">

                    <label class="form-label">
                        Ano de Início
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{ano_inicio}"
                           placeholder="Ex.: 2026"
                           min="1900"
                           max="2100"
                           required>

                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/curso/listar}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-success">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
