<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Disciplina</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card-header {
            background-color: #2c3e50;
            color: #fff;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header">

            <h4 class="mb-0">
                Cadastrar Disciplina
            </h4>

        </div>

        <div class="card-body">

            <form
                th:action="@{/disciplina/salvar}"
                method="post">


                <!-- NOME -->

                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="nome"
                        placeholder="Digite o nome da disciplina"
                        required>

                </div>


                <!-- ÁREA -->

                <div class="mb-3">

                    <label class="form-label">
                        Área
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="area"
                        placeholder="Digite a área da disciplina"
                        required>

                </div>


                <!-- CARGA HORÁRIA -->

                <div class="mb-3">

                    <label class="form-label">
                        Carga Horária
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="carga_horaria"
                        placeholder="Ex: 40h"
                        required>

                </div>


                <!-- DESCRIÇÃO -->

                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        class="form-control"
                        name="descricao"
                        rows="3"
                        placeholder="Digite a descrição da disciplina"
                        required></textarea>

                </div>


                <!-- CURSO -->

                <div class="mb-3">

                    <label class="form-label">
                        Curso
                    </label>

                    <select
                        class="form-select"
                        name="idCurso"
                        required>

                        <option value="">
                            Selecione um curso...
                        </option>

                        <option
                            th:each="curso : ${cursos}"
                            th:value="${curso.idCurso}"
                            th:text="${curso.nome}">
                        </option>

                    </select>

                </div>


                <!-- PROFESSOR -->

                <div class="mb-3">

                    <label class="form-label">
                        Professor
                    </label>

                    <select
                        class="form-select"
                        name="id_professor"
                        required>

                        <option value="">
                            Selecione um professor...
                        </option>

                        <option
                            th:each="professor : ${professores}"
                            th:value="${professor.idProfessor}"
                            th:text="${professor.nome}">
                        </option>

                    </select>

                </div>


                <!-- ANO -->

                <div class="mb-3">

                    <label class="form-label">
                        Ano
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="ano"
                        value="2026"
                        required>

                </div>


                <!-- SEMESTRE -->

                <div class="mb-3">

                    <label class="form-label">
                        Semestre
                    </label>

                    <select
                        class="form-select"
                        name="semestre"
                        required>

                        <option value="">
                            Selecione o semestre...
                        </option>

                        <option value="1">
                            1º semestre
                        </option>

                        <option value="2">
                            2º semestre
                        </option>

                    </select>

                </div>


                <!-- BOTÕES -->

                <div class="d-flex justify-content-end gap-2">

                    <a
                        th:href="@{/disciplina/listar}"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Salvar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
