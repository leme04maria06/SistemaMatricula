<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Matrícula - Painel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .card-entidade {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: none;
            border-radius: 14px;
        }
        .card-entidade:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
        }
        .navbar-brand {
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>Sistema de Matrícula
        </a>
    </div>
</nav>

<div class="container">
    <div class="mb-4">
        <h2 class="fw-bold">Disciplinas já cadastradas por professores.</h2>
        <p class="text-muted">Selecione uma entidade para gerenciar seu cadastro (CRUD completo).</p>

        <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/disciplina/cadastrar}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nova disciplina
        </a>
    </div>
    </div>

    <div class="row g-4">


    <div class="col-12 col-sm-6 col-lg-4"
         th:each="disciplina : ${disciplinas}">

        <div class="card card-entidade h-100 shadow-sm">

            <div class="card-body">
                    <div class="icon-wrap bg-success-subtle text-success">
                        <i class="bi bi-journal-bookmark-fill"></i>
                    </div>
                    <h5 class="card-title" th:text="${disciplina.nome}"></h5>
                    <h6 class="card-text text-muted" th:text="'Id: ' + ${disciplina.idDisciplina}"></h6>
                    <h6 class="card-text text-muted" th:text="'Área: ' + ${disciplina.area}"></h6>
                    <h6 class="card-text text-muted" th:text="'Carga horaria: ' + ${disciplina.cargaHoraria}"></h6>
                    <p class="card-text text-muted" th:text="'Descrição: '+ ${disciplina.descricao}"></p>
                    <a th:href="@{/disciplina/gerenciar/{id}(id=${disciplina.idDisciplina})}"
                        class="btn btn-success btn-sm">
                        <i class="bi bi-gear me-1"></i>Gerenciar
                    </a>
                </div>

            </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
