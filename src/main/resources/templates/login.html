<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Sistema de Matrícula - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .container2 {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .login-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.7rem;

            margin: 0 auto 1rem;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-login {
            border-radius: 8px;
            font-weight: 500;
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">

            <span class="navbar-brand">
                <i class="bi bi-mortarboard-fill me-2"></i>
                Sistema de Matrícula
            </span>

        </div>
    </nav>


    <!-- Login -->
    <div class="container2">

        <div class="card login-card">

            <div class="card-body p-4">

                <!-- Ícone -->
                <div class="login-icon text-white"
                    th:classappend="'bg-' + ${cor}">

                    <i class="bi bi-person-fill"></i>

                </div>


                <!-- Título -->
                <div class="text-center mb-4">

                    <h2 class="fw-bold"
                        th:text="'Login - ' + ${tipoUsuario.nome}">
                    </h2>

                    <p class="text-muted">
                        Informe seus dados para acessar o sistema.
                    </p>

                </div>


                <!-- Formulário -->
                <form th:action="@{/usuario/validar}" method="post">

                    <!-- Tipo de usuário -->
                    <input type="hidden"
                           name="tipo"
                           th:value="${tipoUsuario}">


                    <!-- Login -->
                    <div class="mb-3">

                        <label class="form-label">
                            Login
                        </label>

                        <input type="text"
                               name="login"
                               class="form-control"
                               placeholder="Informe seu login"
                               required>

                    </div>


                    <!-- Senha -->
                    <div class="mb-4">

                        <label class="form-label">
                            Senha
                        </label>

                        <input type="password"
                               name="senha"
                               class="form-control"
                               placeholder="Informe sua senha"
                               required>

                    </div>


                    <!-- Botão -->
                    <button type="submit"
                            class="btn btn-login w-100" th:classappend="'btn-' + ${cor}">Entrar</button>
                    

                </form>
                <!-- Mensagem de erro -->
                <div th:if="${erro}"
                     class="alert alert-danger mt-3 text-center"
                     th:text="${erro}">
                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
