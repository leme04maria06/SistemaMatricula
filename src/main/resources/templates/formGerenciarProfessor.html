<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gerenciar Professor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .container2 {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-entidade {
            width: 100%;
            max-width: 650px;
            border: none;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-5">

    <div class="container">

        <span class="navbar-brand">

            <i class="bi bi-mortarboard-fill me-2"></i>

            Sistema de Matrícula

        </span>

    </div>

</nav>


<div class="container2">

    <div class="card card-entidade">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <i class="bi bi-person-workspace fs-1 text-primary"></i>

                <h2 class="fw-bold mt-2">
                    Gerenciar Professor
                </h2>

                <p class="text-muted">
                    Edite ou exclua os dados do professor.
                </p>

            </div>


            <!-- FORMULÁRIO DE ATUALIZAÇÃO -->

            <form th:action="@{/professor/atualizar}" method="post">

                <input type="hidden"
                       name="idProfessor"
                       th:value="${professor.idProfessor}">


                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input type="text"
                           name="nome"
                           class="form-control"
                           th:value="${professor.nome}"
                           required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            SIAPE
                        </label>

                        <input type="text"
                               name="siape"
                               class="form-control"
                               th:value="${professor.siape}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Idade
                        </label>

                        <input type="number"
                               name="idade"
                               class="form-control"
                               th:value="${professor.idade}"
                               required>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Área
                    </label>

                    <input type="text"
                           name="area"
                           class="form-control"
                           th:value="${professor.area}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Formação
                    </label>

                    <input type="text"
                           name="formacao"
                           class="form-control"
                           th:value="${professor.formacao}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Endereço
                    </label>

                    <input type="text"
                           name="endereco"
                           class="form-control"
                           th:value="${professor.endereco}"
                           required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cidade
                        </label>

                        <input type="text"
                               name="cidade"
                               class="form-control"
                               th:value="${professor.cidade}"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            UF
                        </label>

                        <select name="uf"
                                class="form-select"
                                required>

                            <option value="">
                                Selecione
                            </option>

                            <option th:each="estado : ${ufs}"
                                    th:value="${estado}"
                                    th:text="${estado}"
                                    th:selected="${estado.toString() == professor.uf.toString()}">
                            </option>

                        </select>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Telefone
                        </label>

                        <input type="text"
                               name="telefone"
                               class="form-control"
                               th:value="${professor.telefone}"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               th:value="${professor.email}"
                               required>

                    </div>

                </div>


                <div class="d-flex gap-2 mt-3">

                    <button type="submit"
                            class="btn btn-primary flex-grow-1">

                        <i class="bi bi-check-lg me-1"></i>

                        Salvar alterações

                    </button>


                    <a th:href="@{/professor/listar}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left me-1"></i>

                        Voltar

                    </a>

                </div>

            </form>


            <!-- EXCLUIR -->

            <form th:action="@{/professor/excluir}"
                  method="post"
                  class="mt-3">

                <input type="hidden"
                       name="idProfessor"
                       th:value="${professor.idProfessor}">

                <button type="submit"
                        class="btn btn-danger w-100"
                        onclick="return confirm('Tem certeza que deseja excluir este professor?');">

                    <i class="bi bi-trash me-1"></i>

                    Excluir professor

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
