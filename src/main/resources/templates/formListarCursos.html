<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cursos - Sistema de Matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .table-hover tbody tr:hover { background-color: #f0f4ff; }
        .btn-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>Sistema de Matrícula
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Cursos</h2>
            <p class="text-muted mb-0">Lista de cursos cadastrados no sistema.</p>
        </div>
        <a th:href="@{/curso/cadastrar}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Curso
        </a>
    </div>

    <!-- Mensagem de sucesso/erro, caso o controller envie via redirect attributes -->
    <div th:if="${mensagem}" class="alert alert-success" role="alert">
        <span th:text="${mensagem}"></span>
    </div>
    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <span th:text="${erro}"></span>
    </div>


    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Ano de início</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr th:each="curso : ${cursos}">
                        <td th:text="${curso.idCurso}"></td>
                        <td th:text="${curso.nome}"></td>
                        <td th:text="${curso.ano_inicio}"></td>
                        <td class="text-end">
                            <a th:href="@{/curso/gerenciar/{id}(id=${curso.idCurso})}"
                                class="btn btn-success btn-icon"
                                title="Gerenciar">
                                <i class="bi bi-gear-fill"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cursos)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Nenhum curso cadastrado ainda.
                        </td>
                    </tr>
                </tbody>
            
            </table>
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
