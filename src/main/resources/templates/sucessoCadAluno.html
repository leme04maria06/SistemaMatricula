<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            max-width: 480px;
            text-align: center;
            padding: 40px 30px;
        }
        .icone-sucesso {
            font-size: 64px;
            color: #198754;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="card shadow-sm">
    <div class="icone-sucesso">&#10004;</div>
    <h4 class="mb-2">Aluno cadastrado com sucesso!</h4>
    <p class="text-muted mb-4">Os dados foram salvos corretamente no sistema.</p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/aluno/cadastrar}" class="btn btn-success">Cadastrar outro aluno</a>
    </div>
</div>
</body>
</html>
