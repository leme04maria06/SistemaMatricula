<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gerenciar Disciplina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .container2 {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-entidade {
            width: 100%;
            max-width: 600px;
            border: none;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-5">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">

            <i class="bi bi-mortarboard-fill me-2"></i>

            Sistema de Matrícula

        </a>

    </div>

</nav>


<div class="container2">

    <div class="card card-entidade">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <i class="bi bi-journal-bookmark-fill fs-1 text-success"></i>

                <h2 class="fw-bold mt-2">
                    Gerenciar Disciplina
                </h2>

                <p class="text-muted">
                    Edite ou exclua os dados da disciplina.
                </p>

            </div>


            <form th:action="@{/disciplina/atualizar}" method="post">

                <!-- ID -->
                <input type="hidden"
                       name="idDisciplina"
                       th:value="${disciplina.idDisciplina}">


                <!-- Nome -->
                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input type="text"
                           name="nome"
                           class="form-control"
                           th:value="${disciplina.nome}"
                           required>

                </div>


                <!-- Área -->
                <div class="mb-3">

                    <label class="form-label">
                        Área
                    </label>

                    <input type="text"
                           name="area"
                           class="form-control"
                           th:value="${disciplina.area}"
                           required>

                </div>


                <!-- Carga horária -->
                <div class="mb-3">

                    <label class="form-label">
                        Carga Horária
                    </label>

                    <input type="text"
                           name="carga_horaria"
                           class="form-control"
                           th:value="${disciplina.cargaHoraria}"
                           required>

                </div>


                <!-- Descrição -->
                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea name="descricao"
                              class="form-control"
                              rows="4"
                              th:text="${disciplina.descricao}">
                    </textarea>

                </div>


                <!-- Botões -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success flex-grow-1">

                        <i class="bi bi-check-lg me-1"></i>

                        Salvar alterações

                    </button>


                    <a th:href="@{/disciplina/listar}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left me-1"></i>

                        Voltar

                    </a>

                </div>

            </form>


            <!-- Excluir -->
            <form th:action="@{/disciplina/excluir}"
                  method="post"
                  class="mt-3">

                <input type="hidden"
                       name="idDisciplina"
                       th:value="${disciplina.idDisciplina}">

                <button type="submit"
                        class="btn btn-danger w-100"
                        onclick="return confirm('Tem certeza que deseja excluir esta disciplina?');">

                    <i class="bi bi-trash me-1"></i>

                    Excluir disciplina

                </button>

            </form>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
