<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Curso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card-header {
            background-color: #3457D5;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Cadastrar Professor</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/professor/salvar}"
                  th:object="${professor}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">
                        Nome 
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nome}"
                           placeholder="Digite o nome completo do professor"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Endereço
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{endereco}"
                           placeholder="Digite o endereço"
                           required>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Cidade
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{cidade}"
                           placeholder="Digite a cidade"
                           required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">UF:</label>
                    <select class="form-select" name="uf" required>
                        <option value="">Selecione uma U.F.</option>
                        <option th:each="uf : ${ufs}"
                                th:value="${uf.id_uf}"
                                th:text="${uf.nome}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        e-mail
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="Digite o e-mail"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Telefone
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{telefone}"
                           placeholder="Digite o e-mail"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Idade
                    </label>
                    <input type="number"
                           class="form-control"
                           th:field="*{idade}"
                           placeholder="Digite a idade"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        SIAPE
                    </label>
                    <input type="number"
                           class="form-control"
                           th:field="*{siape}"
                           placeholder="Digite o número SIAPE"
                           required>
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Área de Atuação
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{area}"
                           placeholder="Área que Atua na Instituição"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Formação
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{formacao}"
                           placeholder="Última titulação acadêmica e área"
                           required>

                </div>
                <div class="d-flex justify-content-end gap-2"></div>
                    <a th:href="@{/professor/listar}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-success">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
