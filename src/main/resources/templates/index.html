<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Matrícula - Painel de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .card-entidade {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: none;
            border-radius: 14px;
        }
        .card-entidade:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
        }
        .navbar-brand {
            font-weight: 600;
        }

        .container2 {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .container2 .mb-4 {
            text-align: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <span class="navbar-brand">
            <i class="bi bi-mortarboard-fill me-2"></i>Sistema de Matrícula
        </span>
    </div>
</nav>

<div class="container2">

    <div class="mb-4">
        <h2 class="fw-bold">Painel de Login</h2>
        <p class="text-muted">Selecione o tipo de usuário para entrar.</p>
    </div>

    <div class="row g-4 justify-content-center">

        <!-- Professor -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-entidade shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Professor</h5>

                    <p class="card-text text-muted">
                        Informe os dados para fazer login.
                    </p>

                    <div class="mb-3">
                        <label class="form-label">
                            Siape
                        </label>
                        <input type="text" class="form-control"
                            placeholder="Informe o número do siape"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Senha
                        </label>
                        <input type="password" class="form-control"
                            placeholder="Informe sua senha"
                            required>
                    </div>

                    <a th:href="@{/professor/login}" class="btn btn-primary btn-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Entrar
                    </a>

                </div>
            </div>
        </div>

                <!-- Aluno -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-entidade shadow-sm h-100">
                <div class="card-body">

                    <div class="icon-wrap bg-success text-white">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>

                    <h5 class="card-title">Aluno</h5>

                    <p class="card-text text-muted">
                        Acesso para alunos do sistema.
                    </p>

                    <a th:href="@{/usuario/login(tipo='ALUNO')}"
                    class="btn btn-success">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Entrar
                    </a>

                </div>
            </div>
        </div>

                <!-- Administrador -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-entidade shadow-sm h-100">
                <div class="card-body">

                    <div class="icon-wrap bg-danger text-white">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h5 class="card-title">Administrador</h5>

                    <p class="card-text text-muted">
                        Acesso administrativo do sistema.
                    </p>

                    <a th:href="@{/usuario/login(tipo='ADMINISTRADOR')}"
                    class="btn btn-danger">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Entrar
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>
   
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
